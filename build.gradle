plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base {
    archivesName = mod_id
}

// Gradle runs on a modern JDK; the mod is compiled and run with Java 8 (auto-provisioned by the foojay resolver)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        // Azul covers the most platforms for Java 8 toolchains
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = minecraft_version
    mcpMappingChannel = mapping_channel
    mcpMappingVersion = mapping_version
    username = 'Developer'

    // generates com.someguyssoftware.gottschcore.Tags with the mod version from gradle.properties
    injectedTags.put('VERSION', mod_version)
    injectedTags.put('MOD_ID', mod_id)
    injectedTags.put('MOD_NAME', mod_name)
}

tasks.injectTags.configure {
    outputClassName = 'com.someguyssoftware.gottschcore.Tags'
}

repositories {
    mavenCentral()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version, mod_id: mod_id, mod_name: mod_name,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('mcmod.info') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

eclipse {
    classpath {
        downloadSources = true
    }
}

idea {
    module {
        downloadSources = true
        inheritOutputDirs = true
    }
}
